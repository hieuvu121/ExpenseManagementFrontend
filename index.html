<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Declared here, not @import-ed from index.css: a CSS @import is only
         discovered after the stylesheet has downloaded and parsed, which
         serialises HTML -> CSS -> font CSS -> font files. In <head> the
         preload scanner starts the font request immediately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <title>Housemate — shared household expenses</title>
    <meta
      name="description"
      content="Track shared household expenses, split costs between members, and settle up — with real-time updates and AI-powered spending insights."
    />
    <meta name="theme-color" content="#00857d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Housemate — shared household expenses" />
    <meta
      property="og:description"
      content="Track shared household expenses, split costs between members, and settle up."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
